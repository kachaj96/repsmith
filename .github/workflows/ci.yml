name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm test
      - name: e2e (Playwright, Python)
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          fail=0
          for f in e2e0104 e2e062 e2e063 e2e09 e2e093 e2e_week e2e012; do
            echo "== $f"
            out=$(python tests/e2e/$f.py 2>&1) || fail=1
            echo "$out" | grep -E "^FAIL|Traceback|pass," || true
            echo "$out" | grep -qE "^FAIL|Traceback" && fail=1
          done
          exit $fail
      - name: Screens at 320-768 px, light and dark (overflow, nav, brand lockup)
        run: |
          npm i --no-save playwright@1.63.0
          node tests/visual/shots.mjs "$RUNNER_TEMP/shots"

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the APK to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/variables.gradle') }}
          restore-keys: gradle-
      - run: npm ci
      - run: npm run cap:sync

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.REPSMITH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/repsmith.jks"
            echo "REPSMITH_KEYSTORE_FILE=$RUNNER_TEMP/repsmith.jks" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No REPSMITH_KEYSTORE_BASE64 secret: the release apk is UNSIGNED and cannot be installed until it is signed."
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Build apk
        working-directory: android
        env:
          REPSMITH_KEYSTORE_PASSWORD: ${{ secrets.REPSMITH_KEYSTORE_PASSWORD }}
          REPSMITH_KEY_ALIAS: ${{ secrets.REPSMITH_KEY_ALIAS }}
          REPSMITH_KEY_PASSWORD: ${{ secrets.REPSMITH_KEY_PASSWORD }}
        run: |
          # downloads (the Gradle distribution, dependencies) sometimes fail with a 5xx on the host side: retry before giving up
          for i in 1 2 3 4; do ./gradlew --no-daemon assembleRelease && exit 0; echo "::warning::build attempt $i failed, retrying"; sleep $((i * 20)); done
          exit 1

      - name: Name the apk
        id: apk
        run: |
          v=$(node -p "require('./package.json').version")
          mode=${{ steps.key.outputs.mode }}
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          if [ "$mode" = "release" ]; then out="repsmith-$v-release.apk"; else out="repsmith-$v-release-unsigned.apk"; fi
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "### $out" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
