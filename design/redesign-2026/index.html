<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repsmith Redesign Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a control column, the phone, and a notes column; on phones they stack and the phone scales to the width.
   Page chrome follows the viewer's theme. Each direction inside the phone is a deliberate single look. */
:root {
  --bg: #EEF0F2; --panel: #FFFFFF; --fg: #151A21; --muted: #56606D; --line: #DCE1E6; --accent: #A84B24; --accent-soft: #FBE9E1;
  --display: "Manrope", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B0E11; --panel: #161A1F; --fg: #E9EDF1; --muted: #A3ADB8; --line: #2A3139; --accent: #FF9F70; --accent-soft: #3A2117; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0B0E11; --panel: #161A1F; --fg: #E9EDF1; --muted: #A3ADB8; --line: #2A3139; --accent: #FF9F70; --accent-soft: #3A2117; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.02em; text-wrap: balance; margin: 0; }
.studio { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 260px auto minmax(0, 1fr); gap: 28px; align-items: start; }
.ctl { display: flex; flex-direction: column; gap: 18px; position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
.ctl h1 { font-size: 22px; }
.ctl .lede { color: var(--muted); font-size: 13px; }
.grp label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; flex-direction: column; gap: 4px; }
.seg.row { flex-direction: row; }
.seg button { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 10px; padding: 8px 12px; cursor: pointer; min-height: 40px; }
.seg.row button { flex: 1; text-align: center; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.seg button small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.seg button:focus-visible, .stage button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stagewrap { display: flex; justify-content: center; }
.notes { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 18px; margin-bottom: 6px; }
.card h3 { font-size: 14px; margin: 12px 0 4px; }
.card p, .card li { color: var(--fg); margin: 0 0 6px; }
.card ul { margin: 0; padding-left: 18px; }
.card .muted { color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv b { font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.dots { letter-spacing: 2px; color: var(--accent); white-space: nowrap; }
.dots i { color: var(--line); font-style: normal; }
.wide { grid-column: 1 / -1; }
@media (max-width: 1100px) { .studio { grid-template-columns: 220px auto; } .notes { grid-column: 1 / -1; } }
@media (max-width: 720px) { .studio { grid-template-columns: minmax(0, 1fr); } .ctl { position: static; } .seg { flex-direction: row; flex-wrap: wrap; } .seg button { flex: 1 1 auto; } }
@media (prefers-reduced-motion: reduce) { .stage * { transition: none !important; animation: none !important; } }

/* ---------- the phone ---------- */
.device { --w: 400px; --h: 868px; width: calc(var(--w) * var(--k, 1)); height: calc(var(--h) * var(--k, 1)); position: relative; }
.stage { width: var(--w); height: var(--h); transform: scale(var(--k, 1)); transform-origin: 0 0; border-radius: 34px; overflow: hidden; position: absolute; left: 0; top: 0; box-shadow: 0 0 0 10px #0A0B0D, 0 0 0 11px #2B2F35, 0 30px 60px rgba(0,0,0,.35); font-family: var(--body); font-size: 15px; line-height: 1.35; display: flex; flex-direction: column; }
.stage button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.sbar { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sbar .ic { display: flex; gap: 6px; align-items: center; }
.gbar { height: 22px; flex: none; display: flex; align-items: center; justify-content: center; }
.gbar span { width: 120px; height: 4px; border-radius: 2px; background: currentColor; opacity: .5; }
.scr { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

/* ===== A: Refined Boostcamp (dark, compact tables, custom keypad) ===== */
.A { --a-bg: #0F1113; --a-s1: #191C20; --a-s2: #22262B; --a-s3: #2C3137; --a-line: #2A2F35; --a-tx: #ECEEF0; --a-mu: #959CA5; --a-ac: #FF9F70; --a-ac2: #3A2117; --a-ok: #6FD39A; --a-ok2: #17311F; background: var(--a-bg); color: var(--a-tx); }
.A .top { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 12px 8px; border-bottom: 1px solid var(--a-line); }
.A .tool { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px; font-size: 11px; color: var(--a-mu); min-height: 44px; justify-content: center; }
.A .tool svg { color: var(--a-tx); }
.A .clock { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 17px; padding: 6px 10px; border-radius: 10px; background: var(--a-s1); }
.A .rest { margin-left: auto; display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 800; font-size: 16px; padding: 6px 10px; border-radius: 10px; background: var(--a-ac2); color: var(--a-ac); }
.A .rest + .clock { margin-left: 6px; font-size: 14px; }
.A .fin { margin-left: 8px; background: var(--a-ac); color: #1B0F09; font-weight: 700; padding: 0 16px; height: 40px; border-radius: 10px; }
.A .sub { padding: 10px 16px 4px; display: flex; justify-content: space-between; color: var(--a-mu); font-size: 13px; }
.A .bar { margin: 4px 16px 6px; height: 4px; border-radius: 2px; background: var(--a-s2); overflow: hidden; }
.A .bar i { display: block; height: 100%; background: var(--a-ac); }
.A .ex { margin: 8px 10px 0; background: var(--a-s1); border-radius: 16px; padding: 10px 12px 6px; }
.A .exh { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.A .exh .ix { color: var(--a-mu); font-family: var(--display); font-weight: 700; width: 16px; }
.A .exh .t { flex: 1; min-width: 0; }
.A .exh .nm { font-family: var(--display); font-weight: 700; font-size: 16.5px; line-height: 1.2; }
.A .exh .mt { color: var(--a-mu); font-size: 12px; }
.A .thumb { width: 40px; height: 40px; border-radius: 10px; background: #E8EAED; flex: none; display: flex; align-items: center; justify-content: center; }
.A .chev { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--a-mu); }
.A .sug { margin: 2px 0 6px; font-size: 12.5px; color: var(--a-mu); background: var(--a-s2); border-radius: 10px; padding: 6px 10px; }
.A .sug b { color: var(--a-ac); font-weight: 600; }
.A .note { display: flex; gap: 8px; align-items: center; color: var(--a-mu); font-size: 13px; padding: 4px 0 6px; min-height: 32px; }
.A .note span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.A .tgt { font-size: 12px; color: var(--a-mu); padding: 2px 0 4px; }
.A .tgt b { color: var(--a-tx); font-weight: 600; }
.A .rows { display: grid; grid-template-columns: 30px minmax(0, 1.25fr) 66px 50px 46px 40px; column-gap: 6px; align-items: center; }
.A .rows.h { font-size: 11px; color: var(--a-mu); text-transform: uppercase; letter-spacing: .04em; padding: 4px 0; border-bottom: 1px solid var(--a-line); }
.A .rows.h span:nth-child(n+3) { text-align: center; }
.A .rw { min-height: 48px; border-bottom: 1px solid var(--a-line); }
.A .rw:last-child { border-bottom: 0; }
.A .sn { font-family: var(--display); font-weight: 700; color: var(--a-mu); text-align: center; }
.A .pv { font-size: 13px; color: var(--a-mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.A .pv .r { font-size: 11px; }
.A .fld { height: 38px; border-radius: 9px; background: var(--a-bg); border: 1.5px solid transparent; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--a-tx); }
.A .fld.ph { color: #5D646C; }
.A .fld.on { border-color: var(--a-ac); }
.A .fld.r { font-size: 15px; }
.A .ck { width: 34px; height: 34px; border-radius: 17px; border: 2px solid #4A5057; display: flex; align-items: center; justify-content: center; justify-self: end; }
.A .rw.done .ck { background: var(--a-ok); border-color: var(--a-ok); color: #0E2416; }
.A .rw.done .fld { background: transparent; color: var(--a-mu); }
.A .rw.cur { background: linear-gradient(90deg, transparent, var(--a-ac2) 30%, var(--a-ac2) 70%, transparent); }
.A .rw.done .sn { color: var(--a-ok); }
.A .foot { display: flex; gap: 6px; align-items: center; padding: 6px 0 2px; }
.A .foot button { font-size: 13px; color: var(--a-mu); padding: 0 10px; min-height: 36px; border-radius: 9px; display: flex; align-items: center; gap: 6px; }
.A .foot .more { margin-left: auto; }
.A .collapsed .rows, .A .collapsed .foot, .A .collapsed .sug, .A .collapsed .note, .A .collapsed .tgt { display: none; }
.A .kp { flex: none; background: var(--a-s1); border-top: 1px solid var(--a-line); padding: 8px 8px 6px; box-shadow: 0 -12px 30px rgba(0,0,0,.4); }
.A .kp .ctx { display: flex; justify-content: space-between; font-size: 12px; color: var(--a-mu); padding: 0 6px 6px; }
.A .kp .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.A .kp .tab { background: var(--a-s2); border-radius: 10px; padding: 6px 4px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1.5px solid transparent; }
.A .kp .tab small { font-size: 11px; color: var(--a-mu); }
.A .kp .tab b { font-family: var(--display); font-size: 18px; }
.A .kp .tab.on { border-color: var(--a-ac); }
.A .kp .pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 64px; gap: 6px; }
.A .kp .k { background: var(--a-s2); border-radius: 10px; height: 46px; font-family: var(--display); font-weight: 700; font-size: 20px; }
.A .kp .k.s { font-size: 14px; color: var(--a-ac); background: var(--a-ac2); }
.A .kp .k.go { background: var(--a-ac); color: #1B0F09; font-size: 15px; grid-row: span 2; height: auto; }
.A .kp .rpe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.A .kp .rpe button { background: var(--a-s2); border-radius: 10px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1.5px solid transparent; }
.A .kp .rpe button b { font-family: var(--display); font-size: 19px; }
.A .kp .rpe button small { font-size: 11px; color: var(--a-mu); }
.A .kp .rpe button.on { border-color: var(--a-ac); }
.A .kp .act { display: grid; grid-template-columns: 1fr 2fr; gap: 6px; margin-top: 6px; }
.A .kp .act button { min-height: 46px; border-radius: 10px; background: var(--a-s2); font-weight: 600; }
.A .kp .act .log { background: var(--a-ac); color: #1B0F09; }
.A .nav { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--a-line); padding: 6px 4px 2px; background: var(--a-bg); }
.A .nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--a-mu); min-height: 48px; justify-content: center; border-radius: 12px; }
.A .nav button.on { color: var(--a-ac); }
.A .h1 { font-family: var(--display); font-weight: 800; font-size: 26px; padding: 8px 16px 2px; }
.A .card { margin: 10px 12px 0; background: var(--a-s1); border: 0; border-radius: 16px; padding: 14px; color: var(--a-tx); }
.A .card .eb { font-size: 12px; color: var(--a-mu); }
.A .card .tt { font-family: var(--display); font-weight: 800; font-size: 19px; margin: 2px 0 8px; }
.A .li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--a-line); font-size: 14px; }
.A .li span:last-child { color: var(--a-mu); font-variant-numeric: tabular-nums; white-space: nowrap; }
.A .btn { width: 100%; min-height: 48px; border-radius: 12px; background: var(--a-ac); color: #1B0F09; font-weight: 700; margin-top: 10px; }
.A .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; color: var(--a-mu); }
.A .week i { display: block; margin: 4px auto 0; width: 28px; height: 28px; border-radius: 14px; background: var(--a-s2); font-style: normal; line-height: 28px; color: var(--a-tx); font-weight: 600; }
.A .week i.d { background: var(--a-ok2); color: var(--a-ok); }
.A .week i.t { box-shadow: inset 0 0 0 1.5px var(--a-ac); }
.A .sheet { position: absolute; inset: auto 0 0 0; background: var(--a-s1); border-radius: 22px 22px 0 0; padding: 8px 0 6px; box-shadow: 0 -20px 40px rgba(0,0,0,.5); max-height: 86%; display: flex; flex-direction: column; }
.A .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.A .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--a-s3); margin: 4px auto 8px; }
.A .sh-h { display: flex; justify-content: space-between; align-items: center; padding: 0 18px 8px; }
.A .sh-h h4 { margin: 0; font-family: var(--display); font-size: 19px; }
.A .mrow { display: flex; align-items: center; gap: 14px; padding: 0 18px; min-height: 52px; border-top: 1px solid var(--a-line); font-size: 15px; width: 100%; text-align: left; }
.A .mrow .v { margin-left: auto; color: var(--a-mu); font-size: 14px; }
.A .mrow.danger { color: #FF8A80; }
.A .segc { display: grid; grid-template-columns: 1fr 1fr; background: var(--a-s2); border-radius: 10px; padding: 3px; margin: 0 18px 10px; }
.A .segc button { min-height: 38px; border-radius: 8px; font-weight: 600; color: var(--a-mu); }
.A .segc button.on { background: var(--a-s3); color: var(--a-tx); }
.sw { width: 44px; height: 26px; border-radius: 13px; background: #3A4047; position: relative; flex: none; margin-left: auto; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px; background: #fff; transition: transform .2s; }
.sw.on { background: var(--sw-on, #FF9F70); }
.sw.on::after { transform: translateX(18px); }

/* ===== B: Smith Minimal (light, typographic lines, inline steppers) ===== */
.B { --b-bg: #F4F5F6; --b-s1: #FFFFFF; --b-tx: #151A21; --b-mu: #5E6874; --b-line: #E1E5E9; --b-ac: #A84B24; --b-ac2: #FBE9E1; --b-ok: #22663D; --b-ok2: #E2F2E8; --sw-on: #A84B24; background: var(--b-bg); color: var(--b-tx); }
.B .hd { flex: none; padding: 6px 20px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.B .hd .ti { font-family: var(--display); font-weight: 800; font-size: 20px; }
.B .hd .ti small { display: block; font-family: var(--body); font-weight: 500; font-size: 12.5px; color: var(--b-mu); letter-spacing: 0; }
.B .hd .r { display: flex; gap: 6px; align-items: center; }
.B .ghost { min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--b-line); font-weight: 600; font-size: 14px; background: var(--b-s1); }
.B .ghost.p { background: var(--b-tx); color: var(--b-bg); border-color: var(--b-tx); }
.B .ib { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--b-mu); }
.B .prog { flex: none; display: flex; gap: 3px; padding: 0 20px 6px; }
.B .prog i { flex: 1; height: 3px; border-radius: 2px; background: var(--b-line); }
.B .prog i.d { background: var(--b-tx); }
.B .sec { padding: 18px 20px 6px; border-top: 1px solid var(--b-line); }
.B .sec:first-child { border-top: 0; }
.B .sec .nm { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.2; display: flex; gap: 10px; align-items: flex-start; }
.B .sec .nm .tx { flex: 1; min-width: 0; }
.B .sec .ph { width: 44px; height: 44px; border-radius: 10px; background: #E8EAED; flex: none; display: flex; align-items: center; justify-content: center; }
.B .sec .mt { font-size: 12.5px; color: var(--b-mu); margin-top: 3px; }
.B .sec .mt b { color: var(--b-tx); font-weight: 600; }
.B .sec .sg { margin-top: 6px; font-size: 13px; color: var(--b-ac); font-weight: 600; }
.B .sec .sg span { color: var(--b-mu); font-weight: 400; }
.B .sec .nt { margin-top: 6px; font-size: 13px; color: var(--b-mu); display: flex; gap: 6px; align-items: center; min-height: 28px; }
.B .ln { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 40px; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--b-line); width: 100%; text-align: left; }
.B .ln:last-of-type { border-bottom: 0; }
.B .ln .ix { font-size: 12px; color: var(--b-mu); font-weight: 600; }
.B .ln .v { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -.01em; }
.B .ln .v small { font-family: var(--body); font-weight: 600; font-size: 13px; color: var(--b-mu); margin-left: 4px; }
.B .ln .v.ghostv { color: #B4BBC3; }
.B .ln .last { font-size: 12px; color: var(--b-mu); text-align: right; white-space: nowrap; }
.B .ln .cb { width: 30px; height: 30px; border-radius: 15px; border: 2px solid #C5CBD2; justify-self: end; display: flex; align-items: center; justify-content: center; }
.B .ln.done .cb { background: var(--b-ok); border-color: var(--b-ok); color: #fff; }
.B .ln.done .v small { color: var(--b-ok); }
.B .ln.cur .ix { color: var(--b-ac); }
.B .ln.cur .cb { border-color: var(--b-ac); }
.B .ed { background: var(--b-s1); border-radius: 16px; padding: 12px; margin: 4px -8px 8px; box-shadow: 0 6px 20px rgba(21,26,33,.08), 0 0 0 1px var(--b-line); }
.B .ed .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.B .stp { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; background: var(--b-bg); border-radius: 12px; }
.B .stp button { height: 52px; font-size: 22px; color: var(--b-mu); }
.B .stp .val { text-align: center; }
.B .stp .val b { display: block; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; }
.B .stp .val small { font-size: 11px; color: var(--b-mu); }
.B .chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 10px; }
.B .chips button { height: 42px; border-radius: 21px; border: 1px solid var(--b-line); font-weight: 600; font-variant-numeric: tabular-nums; padding: 0; font-size: 14px; }
.B .chips button.on { background: var(--b-tx); color: var(--b-bg); border-color: var(--b-tx); }
.B .chips .lb { border: 0; color: var(--b-mu); font-size: 12px; padding: 0 2px 0 0; min-width: 0; }
.B .ed .save { margin-top: 10px; width: 100%; min-height: 48px; border-radius: 12px; background: var(--b-ac); color: #fff; font-weight: 700; }
.B .ed .hint { margin-top: 8px; font-size: 12px; color: var(--b-mu); }

/* ---------- render ---------- */
function screenHtml() {
  const scr = S.screen;
  const D = S.dir;
  if (D === 'A') { if (scr === 'home') return A_home(); if (scr === 'menu') return A_menu(); return A_workout(); }
  if (D === 'B') { if (scr === 'home') return B_home(); if (scr === 'menu') return B_menu(); return B_workout(); }

}
function prepScreen() {
  // each screen opens in the state that shows it best
  if (S.screen === 'simple') applyMode('simple');
  if (S.screen === 'advanced') { applyMode('advanced'); S.rest = S.rest || { left: 102, total: 150 }; }
  if (S.screen === 'entry') {
    const lat = 1; S.act = { ex: lat, i: firstOpen(EX[lat]) < 0 ? 0 : firstOpen(EX[lat]) }; S.field = 'kg'; S.buf = null;
    if (S.dir === 'A') S.kp = true; if (S.dir === 'B') S.edit = { ex: lat, i: S.act.i }; if (S.dir === 'C') { S.focus = lat; }
  } else { S.kp = false; S.edit = null; S.cpad = false; }
  if (S.dir === 'C' && S.screen !== 'entry') S.focus = S.act.ex;
}
function render(keepScroll) {

  document.getElementById('screens').innerHTML = SCREENS.map(([k, t]) => `<button aria-pressed="${S.screen === k}" data-c="screen" data-v="${k}">${t}</button>`).join('');

}
function fit() {
  const dev = document.getElementById('device');

  const availH = Math.max(560, window.innerHeight - 60);

/* ---------- interactions ---------- */
document.getElementById('stage').addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, ex = +el.dataset.ex, i = +el.dataset.i;
  ev.stopPropagation();
  const cur = () => curSet();
  switch (a) {
    case 'afield': S.act = { ex, i }; S.field = el.dataset.k; S.buf = null; S.kp = true; if (S.sets[EX[ex].id][i].done) S.sets[EX[ex].id][i].done = false; break;
    case 'atab': commitBuf(); S.field = el.dataset.k; break;
    case 'akey': { let b = S.buf ?? ''; const k = el.dataset.v; if (k === 'del') b = b.slice(0, -1); else if (k === '.' && (b.includes('.') || S.field !== 'kg')) {} else if (b.length < 6) b += k; S.buf = b; break; }
    case 'astep': { commitBuf(); const { e, i: j, s } = cur(); const f = S.field; const base = s[f] ?? planned(e, j)[f]; s[f] = Math.max(0, Math.round((base + +el.dataset.v) * 100) / 100); break; }
    case 'anext': commitBuf(); S.field = S.field === 'kg' ? 'reps' : 'rpe'; break;
    case 'arpe': { const { s } = cur(); s.rpe = +el.dataset.v; break; }
    case 'alog': commitBuf(); logSet(S.act.ex, S.act.i); break;
    case 'aclose': commitBuf(); S.kp = false; break;
    case 'ack': { const s = S.sets[EX[ex].id][i]; if (s.done) s.done = false; else { S.act = { ex, i }; logSet(ex, i); } break; }
    case 'acol': S.collapsed[el.dataset.id] = !S.collapsed[el.dataset.id]; break;
    case 'aadd': S.sets[el.dataset.id].push({ kg: null, reps: null, rpe: null, done: false }); break;
    case 'menu': S.screen = 'menu'; break;
    case 'nomenu': S.screen = 'workout'; break;
    case 'mode': applyMode(el.dataset.v); break;
    case 'sw': S.sw[el.dataset.k] = !S.sw[el.dataset.k]; if (!S.sw.autoRest) S.rest = null; S.mode = Object.values(S.sw).every(Boolean) ? 'advanced' : Object.values(S.sw).every(x => !x) ? 'simple' : 'custom'; break;
    case 'bopen': if (ev.target.closest('.cb')) return; S.act = { ex, i }; S.edit = S.edit && S.edit.ex === ex && S.edit.i === i ? null : { ex, i }; if (S.sets[EX[ex].id][i].done) S.sets[EX[ex].id][i].done = false; break;
    case 'blog': S.act = { ex, i }; logSet(ex, i); break;
    case 'bundo': S.sets[EX[ex].id][i].done = false; break;
    case 'bstep': { const { e, i: j, s } = cur(); const f = el.dataset.k; const base = s[f] ?? planned(e, j)[f]; s[f] = Math.max(0, Math.round((base + +el.dataset.v) * 100) / 100); break; }
    case 'brpe': { const { s } = cur(); s.rpe = +el.dataset.v; break; }
    case 'bsave': logSet(S.act.ex, S.act.i); break;
    case 'restadd': if (S.rest) S.rest.left += 30; break;
    case 'restskip': S.rest = null; break;
    case 'cgo': S.focus = +el.dataset.v; if (firstOpen(EX[S.focus]) >= 0) S.act = { ex: S.focus, i: firstOpen(EX[S.focus]) }; S.cpad = false; S.buf = null; if (S.screen === 'entry') S.screen = 'workout'; break;
    case 'cpick': S.act = { ex, i }; if (S.sets[EX[ex].id][i].done) S.sets[EX[ex].id][i].done = false; break;
    case 'cstep': { const { e, i: j, s } = cur(); const f = el.dataset.k; const base = s[f] ?? planned(e, j)[f]; s[f] = Math.max(0, Math.round((base + +el.dataset.v) * 100) / 100); S.buf = null; break; }
    case 'cpad': S.cpad = true; S.field = 'kg'; S.buf = ''; break;
    case 'ckey': { let b = S.buf ?? ''; const k = el.dataset.v; if (k === 'C') b = ''; else if (k === '.' && b.includes('.')) {} else if (b.length < 6) b += k; S.buf = b; break; }
